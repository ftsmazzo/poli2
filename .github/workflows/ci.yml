name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm ci --prefix painel
      - run: npm run typecheck --prefix painel
      - run: npm test --prefix painel
      - run: npm run build --prefix painel
